name: Automated Preprocessing Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy nltk scikit-learn

      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('stopwords', quiet=True); nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True)"

      - name: Run preprocessing
        run: |
          python preprocessing/automate_Aurellia-Dzakiruna.py

      - name: Upload preprocessing result
        uses: actions/upload-artifact@v4
        with:
          name: ulasan_tiktok_preprocessing
          path: preprocessing/ulasan_tiktok_preprocessing.csv